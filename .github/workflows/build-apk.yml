
name: Build NG LLM APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Checkout Qualcomm GenieX
        uses: actions/checkout@v4
        with:
          repository: qualcomm/ai-hub-apps
          ref: release
          path: qai-hub-apps
          sparse-checkout: geniex_chat_android
          sparse-checkout-cone-mode: true

      
      
      
      
      - name: Customize NG LLM
        working-directory: qai-hub-apps/geniex_chat_android
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("src/main")
          res = root / "res"

          def edit(path, old, new):
              p = root / path
              if not p.exists():
                  raise SystemExit(f"Missing: {p}")
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f"Pattern not found in {p}: {old}")
              p.write_text(s.replace(old, new))

          p = res / "values/strings.xml"
          s = p.read_text()
          s, count = re.subn(
              r'(<string name="app_name"[^>]*>).*?(</string>)',
              r'\1NG LLM\2', s, count=1
          )
          if count == 0:
              raise SystemExit("app_name not found")
          p.write_text(s)

          p = res / "values/colors.xml"
          s = p.read_text()
          s = re.sub(r'(<color name="bg_normal">).*?(</color>)',
                     r'\1#FF121212\2', s)
          s = re.sub(r'(<color name="font_black">).*?(</color>)',
                     r'\1#FFF1F1F1\2', s)
          if '<color name="colorAccent">' not in s:
              s = s.replace('</resources>',
                  '    <color name="colorAccent">#FFB0B0B0</color>\n</resources>')
          p.write_text(s)

          edit("res/drawable/btn_rounded_border.xml",
               '<solid android:color="#FFFFFFFF" />',
               '<solid android:color="#FF303030" />')

          edit("res/drawable/bg_input_box_background.xml",
               '<solid android:color="#ffffff" />',
               '<solid android:color="#FF242424" />')

          edit("res/layout/item_model.xml",
               'android:textColor="#1F1F1F"',
               'android:textColor="#FFF1F1F1"')

          edit("res/layout/activity_main.xml",
               'android:hint="Type prompt..."',
               'android:hint="Type prompt..."\n                        android:textColor="#FFF1F1F1"')

          edit("AndroidManifest.xml",
               'android:theme="@style/Theme.MaterialComponents.Light.NoActionBar"',
               'android:theme="@style/Theme.GenieXDemo"')

          edit("res/values/themes.xml",
               'parent="android:Theme.Material.Light.NoActionBar"',
               'parent="Theme.MaterialComponents.NoActionBar"')

          edit("res/values/themes.xml",
               'parent="Theme.Design.Light.BottomSheetDialog"',
               'parent="Theme.Design.BottomSheetDialog"')

          edit("java/com/geniex/demo/MainActivity.kt",
               'statusBarColorInt(Color.WHITE)\n            statusBarDarkFont(true)',
               'statusBarColorInt(Color.rgb(18, 18, 18))\n            statusBarDarkFont(false)')

          print("NG LLM dark interface updated")
          PY



      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "ndk;27.3.13750724"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APK
        working-directory: qai-hub-apps/geniex_chat_android
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NG-LLM-alpha-debug-apk
          path: qai-hub-apps/geniex_chat_android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
