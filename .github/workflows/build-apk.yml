
name: Build NG LLM APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Checkout Qualcomm GenieX
        uses: actions/checkout@v4
        with:
          repository: qualcomm/ai-hub-apps
          ref: release
          path: qai-hub-apps
          sparse-checkout: geniex_chat_android
          sparse-checkout-cone-mode: true

         - name: Customize NG LLM
        working-directory: qai-hub-apps/geniex_chat_android
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("src/main")
          res = root / "res"

          manifest = root / "AndroidManifest.xml"
          strings = res / "values/strings.xml"
          themes = res / "values/themes.xml"
          colors = res / "values/colors.xml"

          for file in (manifest, strings, themes, colors):
              if not file.exists():
                  raise SystemExit(f"Required file not found: {file}")

          text = strings.read_text()
          text, count = re.subn(
              r'(<string name="app_name">).*?(</string>)',
              r'\1NG LLM\2', text, count=1
          )
          if count == 0:
              raise SystemExit("app_name not found")
          strings.write_text(text)

          text = themes.read_text()
          text = text.replace(
              "android:Theme.Material.Light.NoActionBar",
              "android:Theme.Material.NoActionBar"
          )
          text = text.replace(
              "Theme.Design.Light.BottomSheetDialog",
              "Theme.Design.BottomSheetDialog"
          )
          themes.write_text(text)

          text = colors.read_text()
          text = re.sub(
              r'(<color name="bg_normal">).*?(</color>)',
              r'\1#FF121212\2', text
          )
          text = re.sub(
              r'(<color name="font_black">).*?(</color>)',
              r'\1#FFF1F1F1\2', text
          )
          colors.write_text(text)

          for folder in ("layout", "drawable"):
              directory = res / folder
              if not directory.exists():
                  continue
              for file in directory.rglob("*.xml"):
                  text = file.read_text()
                  text = text.replace("#F6F7F9", "#FF121212")
                  text = text.replace("#1F1F1F", "#FFF1F1F1")
                  text = text.replace("#E7E7E7", "#FF333333")
                  file.write_text(text)

          print("NG LLM dark theme customization applied")
          PY

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "ndk;27.3.13750724"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APK
        working-directory: qai-hub-apps/geniex_chat_android
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NG-LLM-alpha-debug-apk
          path: qai-hub-apps/geniex_chat_android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
