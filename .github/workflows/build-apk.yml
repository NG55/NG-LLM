
name: Build NG LLM APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Checkout Qualcomm GenieX
        uses: actions/checkout@v4
        with:
          repository: qualcomm/ai-hub-apps
          ref: release
          path: qai-hub-apps
          sparse-checkout: geniex_chat_android
          sparse-checkout-cone-mode: true

      - name: Customize NG LLM
        working-directory: qai-hub-apps/geniex_chat_android
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path

          root = Path("app/src/main")
          manifest = root / "AndroidManifest.xml"
          strings = root / "res/values/strings.xml"

          if not manifest.exists() or not strings.exists():
              raise SystemExit("Required Android files not found")

          text = manifest.read_text()
          old = "Theme.MaterialComponents.Light.NoActionBar"
          if old not in text:
              raise SystemExit("Original theme not found in manifest")
          manifest.write_text(text.replace(
              old, "Theme.MaterialComponents.NoActionBar"
          ))

          text = strings.read_text()
          import re
          text, count = re.subn(
              r'(<string name="app_name">).*?(</string>)',
              r'\1NG LLM\2',
              text,
              count=1
          )
          if count == 0:
              raise SystemExit("app_name string not found")
          strings.write_text(text)
          PY

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "ndk;27.3.13750724"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APK
        working-directory: qai-hub-apps/geniex_chat_android
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NG-LLM-alpha-debug-apk
          path: qai-hub-apps/geniex_chat_android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
